syntax = "proto3";

package riskengine.v1;

option go_package = "github.com/yourorg/riskengine/api/grpc/v1;riskv1";

// DecisionService is the primary gRPC API for real-time risk decisions.
service DecisionService {
  // Evaluate performs a synchronous risk evaluation and returns a decision.
  rpc Evaluate(DecisionRequest) returns (DecisionResponse);

  // BatchEvaluate performs multiple evaluations in one RPC call.
  // Results are returned in the same order as requests.
  rpc BatchEvaluate(BatchDecisionRequest) returns (BatchDecisionResponse);

  // Health returns the engine's operational status.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// DecisionRequest carries all inputs for a single risk evaluation.
//
// Design: only universal identity/routing fields are promoted to top-level.
// All scene-specific business data (amount, merchant_id, order_type, etc.)
// must be passed via extra so the engine stays domain-agnostic.
message DecisionRequest {
  // request_id is a UUID v4; generated by the engine if empty.
  string request_id = 1;
  string scene_code = 2;
  string user_id    = 3;
  string device_id  = 4;
  string session_id = 5;
  string ip         = 6;
  // extra holds all scene-specific key-value pairs.
  // Example: {"amount": "100000", "merchant_id": "M001", "channel": "ALIPAY"}
  map<string, string> extra = 7;
}

message BatchDecisionRequest {
  repeated DecisionRequest requests = 1;
}

// DecisionResponse is the output of a single risk evaluation.
message DecisionResponse {
  string   request_id              = 1;
  Decision decision                = 2;
  int32    risk_score              = 3; // 0–1000
  RiskLevel risk_level             = 4;
  repeated string hit_rules        = 5;
  map<string, double> model_scores = 6;
  repeated string risk_reasons     = 7;
  repeated string actions          = 8;
  int64 cost_ms                    = 9;
}

message BatchDecisionResponse {
  repeated DecisionResponse responses = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  map<string, bool> components = 2;
}

enum Decision {
  DECISION_UNSPECIFIED    = 0;
  DECISION_PASS           = 1;
  DECISION_REJECT         = 2;
  DECISION_MANUAL_REVIEW  = 3;
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW         = 1;
  RISK_LEVEL_MEDIUM      = 2;
  RISK_LEVEL_HIGH        = 3;
  RISK_LEVEL_CRITICAL    = 4;
}
