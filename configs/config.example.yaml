# RiskEngine Example Configuration
# Copy to config.yaml and fill in your values.
# All durations accept Go duration syntax: 10ms, 5s, 1m, etc.

server:
  addr: ":8080"
  grpc_addr: ":9090"
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "60s"
  drain_timeout: "30s"

redis:
  # Single node: one address. Cluster mode: multiple addresses.
  addrs:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 50

kafka:
  brokers:
    - "localhost:9092"
  audit_topic: "risk.decisions"

engine:
  # Directory containing PolicySet YAML files (one file per scene).
  policy_dir: "configs/policies"
  # Interval between hot-reload checks for policy/rule changes.
  reload_interval: "30s"
  # Global fallback when no policy matches the requested scene.
  fallback: "PASS"

feature:
  # Maximum time budget for all parallel feature fetches combined.
  total_timeout: "50ms"
  # Per-fetcher timeouts (individual fetchers can override these).
  redis_timeout: "10ms"
  external_timeout: "30ms"

feature_store:
  # Set enabled: true to connect to the standalone Feature Store gRPC service.
  # When false (default), only in-process fetchers (velocity, etc.) are used.
  enabled: false
  # gRPC endpoint of the Feature Store service.
  # Use "localhost:9100" for sidecar mode, or the k8s service DNS for standalone.
  addr: "localhost:9100"
  dial_timeout: "5s"
  # Per-RPC deadline for feature fetch calls from the decision engine.
  request_timeout: "20ms"
  # List of feature groups to fetch from the store.
  # Each entry creates one FeatureStoreFetcher registered in feature.Service.
  groups:
    - name: "user_profile"
      timeout: "15ms"
    - name: "velocity"
      timeout: "10ms"

log:
  level: "info"    # debug | info | warn | error
  format: "json"   # json | console
