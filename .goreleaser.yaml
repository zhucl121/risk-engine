version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: riskengine
    main: ./cmd/server
    binary: riskengine
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: riskengine
    builds: [riskengine]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - configs/config.example.yaml
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: yourorg
    name: riskengine
  draft: false
  prerelease: auto
