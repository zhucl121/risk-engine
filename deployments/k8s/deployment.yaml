apiVersion: apps/v1
kind: Deployment
metadata:
  name: riskengine
  labels:
    app: riskengine
    version: latest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: riskengine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: riskengine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: riskengine
          image: ghcr.io/yourorg/riskengine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: GOGC
              value: "200"
            - name: GOMEMLIMIT
              value: "900MiB"
          envFrom:
            - secretRef:
                name: riskengine-secrets
          volumeMounts:
            - name: config
              mountPath: /configs
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Allow in-flight requests to drain before SIGTERM.
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: config
          configMap:
            name: riskengine-config
---
apiVersion: v1
kind: Service
metadata:
  name: riskengine
  labels:
    app: riskengine
spec:
  selector:
    app: riskengine
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: riskengine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: riskengine
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
