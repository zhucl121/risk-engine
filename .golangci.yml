version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - misspell
    - gocritic
    - noctx
    - bodyclose
    - contextcheck
    - exhaustive
    - exportloopref
    - nilerr
    - prealloc
    - unparam
    - wrapcheck

linters-settings:
  goimports:
    local-prefixes: github.com/zhucl121/risk-engine
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
  prealloc:
    simple: true
    range-loops: true
    for-loops: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - wrapcheck
        - errcheck
    - path: cmd/
      linters:
        - wrapcheck
    - path: pkg/dsl/parser/
      linters:
        - govet
        - staticcheck
        - unused
        - exhaustive
  max-issues-per-linter: 0
  max-same-issues: 0
